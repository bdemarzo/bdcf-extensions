name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Restore dependencies
      run: dotnet restore Bdcf.Extensions.sln

    - name: Build
      run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Bdcf.Extensions.sln --configuration Release --no-build

    - name: Pack
      run: dotnet pack Bdcf.Extensions.sln --configuration Release --no-build --output ./nupkg

    - name: Publish to GitHub Packages
      run: dotnet nuget push ./nupkg/*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
