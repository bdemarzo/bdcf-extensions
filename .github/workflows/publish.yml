name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        run: |
          echo "Checking tag: $GITHUB_REF"
          if [[ "$GITHUB_REF" =~ refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "Valid semver tag detected"
          else
            echo "Invalid version tag. Use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
        shell: bash

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
        
      - name: Strip 'v' from tag
        id: clean_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "clean_version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore Bdcf.Extensions.sln

      - name: Build
        run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Bdcf.Extensions.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack Bdcf.Extensions.sln --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.clean_version.outputs.clean_version }}
        
      - name: Publish
        shell: cmd
        run: dotnet nuget push nupkg\*.nupkg --source "https://nuget.pkg.github.com/bdemarzo/index.json" --api-key ${{ secrets.NUGET_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
