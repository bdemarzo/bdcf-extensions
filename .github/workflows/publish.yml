name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        run: |
          echo "Checking tag: $GITHUB_REF"
          if [[ "$GITHUB_REF" =~ refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "Valid semver tag detected"
          else
            echo "Invalid version tag. Use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
        shell: bash

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
        
      - name: Strip 'v' from tag
        id: clean_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "clean_version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore Bdcf.Extensions.sln /p:ContinuousIntegrationBuild=true

      - name: Build
        run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test unit projects
        shell: pwsh
        run: |
          dotnet test tests/Bdcf.Extensions.Tests/Bdcf.Extensions.Tests.csproj --configuration Release --no-build
          dotnet test tests/Bdcf.Extensions.Web.Tests/Bdcf.Extensions.Web.Tests.csproj --configuration Release --no-build
          dotnet test tests/Bdcf.Extensions.DacPac.Tests/Bdcf.Extensions.DacPac.Tests.csproj --configuration Release --no-build
          dotnet test tests/Bdcf.Extensions.Data.Tests/Bdcf.Extensions.Data.Tests.csproj --configuration Release --no-build

      - name: Test integration projects
        run: dotnet test tests/Bdcf.Extensions.DacPac.IntegrationTests/Bdcf.Extensions.DacPac.IntegrationTests.csproj --configuration Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ steps.clean_version.outputs.clean_version }}'
          $packArgs = @(
            '--configuration', 'Release',
            '--no-build',
            '--output', './nupkg',
            '-warnaserror',
            "/p:Version=$version",
            '/p:ContinuousIntegrationBuild=true',
            '/p:TreatWarningsAsErrors=true'
          )

          dotnet pack src/Bdcf.Extensions/Bdcf.Extensions.csproj @packArgs
          dotnet pack src/Bdcf.Extensions.Web/Bdcf.Extensions.Web.csproj @packArgs
          dotnet pack src/Bdcf.Extensions.DacPac/Bdcf.Extensions.DacPac.csproj @packArgs
          dotnet pack src/Bdcf.Extensions.Data/Bdcf.Extensions.Data.csproj @packArgs
        
      - name: Publish packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path './nupkg' -Filter '*.nupkg' -File)
          if ($packages.Count -eq 0) {
            throw 'No .nupkg files found in ./nupkg.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source "https://nuget.pkg.github.com/bdemarzo/index.json" --api-key ${{ secrets.NUGET_TOKEN }} --skip-duplicate
          }

      - name: Publish symbol packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path './nupkg' -Filter '*.snupkg' -File)
          if ($packages.Count -eq 0) {
            throw 'No .snupkg files found in ./nupkg.'
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source "https://nuget.pkg.github.com/bdemarzo/index.json" --api-key ${{ secrets.NUGET_TOKEN }} --skip-duplicate
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
