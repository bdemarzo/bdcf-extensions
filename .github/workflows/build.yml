name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore Bdcf.Extensions.sln

    - name: Build
      run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore

    - name: Test unit projects
      shell: pwsh
      run: |
        dotnet test tests/Bdcf.Extensions.Tests/Bdcf.Extensions.Tests.csproj --configuration Release --no-build
        dotnet test tests/Bdcf.Extensions.Web.Tests/Bdcf.Extensions.Web.Tests.csproj --configuration Release --no-build
        dotnet test tests/Bdcf.Extensions.DacPac.Tests/Bdcf.Extensions.DacPac.Tests.csproj --configuration Release --no-build
        dotnet test tests/Bdcf.Extensions.Data.Tests/Bdcf.Extensions.Data.Tests.csproj --configuration Release --no-build

  integration-tests:
    name: Integration tests
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore Bdcf.Extensions.sln

    - name: Build
      run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore

    - name: Test DacPac integration project
      run: dotnet test tests/Bdcf.Extensions.DacPac.IntegrationTests/Bdcf.Extensions.DacPac.IntegrationTests.csproj --configuration Release --no-build
