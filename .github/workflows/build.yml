name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Restore dependencies
      run: dotnet restore Bdcf.Extensions.sln

    - name: Build
      run: dotnet build Bdcf.Extensions.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Bdcf.Extensions.sln --configuration Release --no-build
